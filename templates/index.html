<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chest X-Ray AI Classifier</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f8fb;
        }

        .main-card{
            margin-top:60px;
            border:none;
            border-radius:20px;
            box-shadow:0px 4px 20px rgba(0,0,0,0.1);
        }

        .header{
            text-align:center;
            margin-bottom:20px;
        }

        .header h1{
            color:#0d6efd;
            font-weight:700;
        }

        .header p{
            color:gray;
        }

        .result-card{
            margin-top:20px;
            border-radius:15px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card main-card p-4">

                <div class="header">

                    <h1>🩺 Chest X-Ray AI Classifier</h1>

                    <p>
                        Upload a Chest X-Ray image and detect
                        COVID-19, Pneumonia, or Normal cases using Deep Learning.
                    </p>

                </div>

                <form method="POST" enctype="multipart/form-data">

                    <div class="mb-3">

                        <label class="form-label">
                            Select Chest X-Ray Image
                        </label>

                        <input
                            class="form-control"
                            type="file"
                            name="image"
                            required
                        >

                    </div>

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg">

                            Predict Disease

                        </button>

                    </div>

                </form>

                {% if prediction %}

                <div class="card result-card bg-light p-3">

                    <h3>
                        Prediction:
                        <span class="text-primary">
                            {{ prediction }}
                        </span>
                    </h3>

                    <h5>
                        Confidence:
                        {{ confidence }} %
                    </h5>

                    <div class="progress">

                        <div
                            class="progress-bar"
                            role="progressbar"
                            style="width: {{ confidence }}%;">

                            {{ confidence }} %

                        </div>

                    </div>

                </div>

                {% endif %}

            </div>

        </div>

    </div>

</div>

</body>

</html>
